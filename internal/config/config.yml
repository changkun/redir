title: "Changkun Ou | changkun.de"
host: https://changkun.de
# Bind every interface. Naming a host here resolves to one interface, and
# a container on more than one network then listens on whichever address
# won the lookup, leaving the reverse proxy unable to reach it.
addr: :9123
development: true
# The schema is applied at start up, so the database and its role are all
# that must exist beforehand.
store: postgres://redir:redir@localhost:5432/redir?sslmode=disable
cors: false
# Further sites this instance serves, keyed by hostname. Each entry
# carries only what differs: the store keys links by hostname, so every
# site has its own namespace of aliases and its own statistics.
#
#   hosts:
#     golang.design:
#       # The organisation /x/ import paths resolve to, and the one
#       # checkvcs probes when an alias is not found.
#       repo_path: https://github.com/golang-design
#       # The impressum and privacy pages name an operator, so they do
#       # not follow onto another domain unless it is the same one.
#       legal: false
hosts: {}
s:
  prefix: /s/
x:
  enable: true
  prefix: /x/
  vcs: git
  repo_path: https://github.com/changkun
  godoc_host: https://pkg.go.dev/
auth:
  enable: basic # or latere, none
  basic:
    - username: changkun
      password: redir
stats:
  enable: true
gdpr:
  hide_ip: false
  owner:
    name: changkun.de
    domain: https://changkun.de
  contact:
    enable: true
    email: contact@changkun.de
  impressum:
    enable: true
    content: |
      <h1 id="impressum">Impressum</h1>
      <p>This page contains the provided legal information regarding the current user of redir.</p>
      <h2 id="address">Address</h2>
      <p>Mauthäuslstraße 81379 München</p>
      <h2 id="disclaimer">Disclaimer</h2>
      <p>All information on these redirects was created to the best of our knowledge, but errors cannot be ruled out with absolute certainty. Only the stipulations in the relevant legal bases (laws, ordinances, statutes) are legally binding.<br />
      Redirected links to external offers are prompt to visitors to confirm a redirect action. Despite careful control, no liability is assumed for us. The operators of the linked pages are individually responsible for their created redir records.</p>
  # Warning: please adapt the privacy policy before using it.
  privacy:
    enable: true
    content: |
      <h1 id="privacy-policy">Privacy Policy</h1>
      <p>Last updated: November 07, 2021<br />
      This Privacy Policy describes Our policies and procedures on the collection, use and disclosure of Your information when You use the Service and tells You about Your privacy rights and how the law protects You.<br />
      We use Your Personal data to provide and improve the Service. By using the Service, You agree to the collection and use of information in accordance with this Privacy Policy.</p>
