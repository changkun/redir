<!-- The frame every server-rendered page sits in.
     It carries the same design as the console the dashboard renders, so
     a visitor who lands on a warning or a countdown does not arrive at a
     different site. The stylesheet lives here once rather than in each
     page, where five copies of it had drifted apart. Its colors, type and
     controls are those of dashboard/src/index.css; see
     specs/007-shared-design.md. -->
{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{block "title" .}}redir{{end}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M5 3h8v8h-2.4V7.1L4.7 13 3 11.3 8.9 5.4H5z' fill='%232a78d6'/%3E%3C/svg%3E">
<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --border: rgba(11, 11, 11, 0.1); --wash: rgba(11, 11, 11, 0.045); --pv: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255, 255, 255, 0.1); --wash: rgba(255, 255, 255, 0.06); --pv: #3987e5;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: inherit; }
main { max-width: 760px; margin: 0 auto; padding: 14px 16px 28px; }
:focus-visible { outline: 2px solid var(--pv); outline-offset: 1px; }

.top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.top h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
.top h1 a { text-decoration: none; }
.top p { margin: 0; color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px 18px; }

/* The legal pages are prose handed over as HTML, so they get a measure
   and a little air. The headings step down quietly. */
.card h1 { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; margin: 22px 0 8px; }
.card h2 { font-size: 14px; font-weight: 650; margin: 20px 0 4px; }
.card h3 { font-size: 13px; font-weight: 650; color: var(--ink-2); margin: 16px 0 2px; }
.card > :first-child { margin-top: 0; }
.card > :last-child { margin-bottom: 0; }
.card p, .card li { color: var(--ink-2); font-size: 14px; line-height: 1.6; max-width: 68ch; }
.card p { margin: 0 0 10px; }
.card ul { padding-left: 20px; margin: 0 0 10px; }
.card a { text-underline-offset: 2px; overflow-wrap: anywhere; }
.card strong { color: var(--ink); font-weight: 650; }

.btn { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; text-decoration: none; font: inherit; }
.btn:hover { background: var(--wash); }
.btn.primary { background: var(--ink); border-color: transparent; color: var(--surface); }
.btn.primary:hover { background: var(--ink); opacity: 0.86; }

.foot { margin: 12px 0 0; color: var(--ink-2); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.foot a { color: var(--ink-2); }
.foot a:hover { color: var(--ink); }
{{block "style" .}}{{end}}
</style>
</head>
<body>
<main>
<header class="top">
  <h1><a href="{{.Prefix}}">redir</a></h1>
  <p>Short links on {{.Site}}</p>
</header>

<section class="card">
{{block "content" .}}{{end}}
</section>

<p class="foot">
  {{if .ShowImpressum}}<a href="{{.Prefix}}.impressum">Impressum</a>{{end}}
  {{if .ShowPrivacy}}<a href="{{.Prefix}}.privacy">Privacy</a>{{end}}
  {{if .ShowContact}}<a href="{{.Prefix}}.contact">Contact</a>{{end}}
  <a href="{{.Prefix}}">All links</a>
</p>
</main>
{{block "script" .}}{{end}}
</body>
</html>{{end}}
