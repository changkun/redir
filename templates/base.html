<!-- The frame every server-rendered page sits in.
     It carries the same design as the console the dashboard renders, so
     a visitor who lands on a warning or a countdown does not arrive at a
     different site. The stylesheet lives here once rather than in each
     page, where five copies of it had drifted apart. -->
{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{block "title" .}}redir{{end}}</title>
<style>
:root {
  --bg: #0b0c0e;
  --surface: #121316;
  --line: #232529;
  --text: #e6e7e9;
  --text-dim: #9aa0a6;
  --text-faint: #6b7176;
  --accent: #4c8dff;
  --warn: #d29922;
  --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas,
    'Liberation Mono', monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
    'Helvetica Neue', Arial, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body { display: flex; flex-direction: column; }
a { color: var(--text); text-decoration: none; }
a:hover { color: var(--accent); }
code, .mono { font-family: var(--mono); }

header {
  display: flex; align-items: center; gap: 10px;
  height: 48px; padding: 0 24px;
  border-bottom: 1px solid var(--line);
}
header .brand { font-family: var(--mono); font-weight: 600; }
header .sep { color: var(--line); }
header .site { color: var(--text-dim); font-family: var(--mono); font-size: 13px; }

main {
  flex: 1; width: 100%; max-width: 760px;
  margin: 0 auto; padding: 48px 24px 64px;
}

/* Legal pages are prose, so they get a measure and a little air. The
   headings step down quietly rather than shouting. */
main h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 16px; }
main h2 { font-size: 15px; font-weight: 600; color: var(--text); margin: 28px 0 6px; }
main h3 { font-size: 14px; font-weight: 600; color: var(--text-dim); margin: 20px 0 4px; }
main p, main li { color: var(--text-dim); }
main a { color: var(--accent); word-break: break-word; }
main ul { padding-left: 20px; }
main strong { color: var(--text); font-weight: 600; }

.btn {
  display: inline-block; border: 1px solid var(--line);
  background: var(--surface); color: var(--text);
  border-radius: 6px; padding: 6px 14px; font-size: 13px;
  cursor: pointer; font-family: inherit;
}
.btn:hover { border-color: var(--accent); color: var(--text); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { color: #fff; opacity: 0.9; }

footer {
  border-top: 1px solid var(--line);
  padding: 16px 24px; text-align: center;
  color: var(--text-faint); font-size: 12px;
}
footer a { color: var(--text-faint); margin: 0 8px; }
footer a:hover { color: var(--accent); }

:where(a, button, [tabindex]):focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
}
{{block "style" .}}{{end}}
</style>
</head>
<body>
<header>
  <a class="brand" href="{{.Prefix}}">redir</a>
  <span class="sep">/</span>
  <span class="site">{{.Site}}</span>
</header>

<main>
{{block "content" .}}{{end}}
</main>

<footer>
  {{if .ShowImpressum}}<a href="{{.Prefix}}.impressum">Impressum</a>{{end}}
  {{if .ShowPrivacy}}<a href="{{.Prefix}}.privacy">Privacy</a>{{end}}
  {{if .ShowContact}}<a href="{{.Prefix}}.contact">Contact</a>{{end}}
  <a href="{{.Prefix}}">Links</a>
</footer>
{{block "script" .}}{{end}}
</body>
</html>{{end}}
