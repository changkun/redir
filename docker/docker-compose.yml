services:
  redir:
    restart: always
    image: redir:latest
    environment:
      REDIR_CONF: ./data/redirconf.yml
    volumes:
      # The deployment config stays on the host: it holds credentials and
      # it outlives any image. Only this file, not the whole data
      # directory, which also holds the database.
      - ../data/redirconf.yml:/app/data/redirconf.yml:ro
    # Login credentials for auth.latere.ai. Optional so a deployment using
    # basic auth needs no .env file. See .env.template.
    env_file:
      - path: ../.env
        required: false
    deploy:
      replicas: 1
    networks:
      - traefik_proxy
      - postgres_internal
networks:
  traefik_proxy:
    external: true
  # Owned by changkun/proxy, which runs the shared database instance the
  # store lives on. See specs/001-shared-postgres.md.
  postgres_internal:
    external: true
