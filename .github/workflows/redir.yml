name: redir

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    # The store tests run against a real PostgreSQL rather than a mock:
    # the queries are the thing under test, and a mock would only assert
    # that they were called.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: redir
          POSTGRES_PASSWORD: redir
          POSTGRES_DB: redir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U redir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      REDIR_TEST_POSTGRES: postgres://redir:redir@127.0.0.1:5432/redir_test?sslmode=disable

    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27'

    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: dashboard/package-lock.json

    - name: Build frontend
      run: |
        make dashboard

    - name: Test frontend
      run: |
        cd dashboard && npm test

    - name: Vet
      run: |
        go vet ./...

    # -p 1 because the store and migration tests share one database and
    # both empty the tables; running their packages at the same time
    # would make them fail for reasons unrelated to the code.
    - name: Race Test
      run: |
        go test -v -race -count=1 -p 1 ./...

    - name: Test
      run: |
        go test -v -p 1 -coverprofile=coverage.txt -covermode=atomic ./...
