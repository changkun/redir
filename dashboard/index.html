<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>redir</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M5 3h8v8h-2.4V7.1L4.7 13 3 11.3 8.9 5.4H5z' fill='%2338538f'/%3E%3C/svg%3E" />
    <script>
      // Before the styles, so a dark page never paints light first. The
      // key is the one changkun.de's other pages keep the reader's choice
      // under; without a choice the system's setting decides, and keeps
      // deciding while the page is open.
      ;(function () {
        var root = document.documentElement
        var media = matchMedia('(prefers-color-scheme: dark)')
        var apply = function () {
          var t = null
          try {
            t = localStorage.getItem('theme')
          } catch (e) {}
          if (t !== 'light' && t !== 'dark') t = media.matches ? 'dark' : 'light'
          root.setAttribute('data-theme', t)
        }
        apply()
        media.addEventListener('change', apply)
      })()
    </script>
    <style>
      /* Inter, served from the binary rather than a font host, so a
         visitor's address goes nowhere a link did not send it. The server
         rewrites /static to the console's own route. */
      @font-face { font-family: Inter; font-style: normal; font-weight: 400; font-display: swap; src: url(/static/fonts/inter-400-latin.woff2) format('woff2'); }
      @font-face { font-family: Inter; font-style: normal; font-weight: 500; font-display: swap; src: url(/static/fonts/inter-500-latin.woff2) format('woff2'); }
      @font-face { font-family: Inter; font-style: normal; font-weight: 600; font-display: swap; src: url(/static/fonts/inter-600-latin.woff2) format('woff2'); }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!--
    Replaced by server, for example:

    <div id="root" is-admin="true" stats-mode="true" dev-mode="true"></div>
    -->
    <div id="root"
      is-admin="{{.AdminView}}"
      stats-mode="{{.StatsMode}}"
      dev-mode="{{.DevMode}}"
      show-impressum="{{.ShowImpressum}}"
      show-privacy="{{.ShowPrivacy}}"
      show-contact="{{.ShowContact}}"
      logout-url="{{.LogoutURL}}"
    ></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
